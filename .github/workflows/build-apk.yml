
name: Gerar APK MXFlix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Extrair ZIP
        run: |
          mkdir -p extracted
          unzip -q -o MXFlix-Android.zip -d extracted

      - name: Encontrar projeto
        run: |
          PKG=$(find extracted -path '*/mobile/package.json' -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$PKG" ]; then
            echo "ERRO: mobile/package.json não encontrado no ZIP"
            find extracted -maxdepth 4 | head -50
            exit 1
          fi
          APP=$(dirname "$PKG")
          echo "APP=$APP" >> $GITHUB_ENV
          echo "Projeto em: $APP"

      - name: Instalar dependências
        run: |
          cd "$APP"
          npm install

      - name: Compilar APK
        id: g1
        continue-on-error: true
        run: |
          cd "$APP/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Plano B - regenerar Android com Expo
        if: steps.g1.outcome == 'failure'
        run: |
          cd "$APP"
          npx expo prebuild -p android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MXFlix-APK
          path: ${{ env.APP }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
