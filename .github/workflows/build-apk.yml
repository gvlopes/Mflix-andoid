
name: Gerar APK HarpiaPlay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar arquivos do GitHub
      - name: Baixar projeto
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Preparar Android SDK
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # 4. Encontrar e extrair ZIP
      - name: Extrair projeto HarpiaPlay
        shell: bash
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 5 -type f \
            -iname "HarpiaPlay-Android.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: HarpiaPlay-Android.zip não encontrado."
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

      # 5. Localizar projeto Gradle
      - name: Encontrar projeto Android
        shell: bash
        run: |
          APP_DIR=$(find extracted -type f \
            -name settings.gradle \
            -print -quit | xargs dirname)

          if [ -z "$APP_DIR" ] || \
             [ ! -f "$APP_DIR/app/build.gradle" ]; then
            echo "ERRO: Projeto Android não encontrado."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "Projeto encontrado: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      # 6. Preparar Gradle
      - name: Preparar Gradle
        run: |
          cd "$APP_DIR"
          chmod +x gradlew

      # 7. Compilar APK Release
      - name: Compilar APK
        run: |
          cd "$APP_DIR"
          ./gradlew assembleRelease --no-daemon

      # 8. Disponibilizar APK
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: HarpiaPlay-APK
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

